name: Check and publish game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript and required files
        run: |
          node --check game.js
          test -s index.html
          test -s style.css
      - name: Package playable files
        run: |
          mkdir -p _site
          cp index.html style.css game.js _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    # Private repositories need a supported paid plan and PAGES_ENABLED=true.
    # Public repositories deploy once Pages is configured to use GitHub Actions.
    if: github.event_name != 'pull_request' && (github.event.repository.private == false || vars.PAGES_ENABLED == 'true')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
